name: Kiểm tra website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test và build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Chạy toàn bộ kiểm tra
        run: npm run check

      - name: Lưu bản build
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
